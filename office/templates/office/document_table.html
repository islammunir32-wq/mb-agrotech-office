{% load currency %}<div class="table-wrap"><table><thead><tr><th>নম্বর</th><th>গ্রাহক</th><th>ধরন / তারিখ</th><th>পরিমাণ</th><th>অবস্থা</th></tr></thead><tbody>{% for d in docs %}<tr><td><a href="{% url 'document' d.pk %}">{{ d.number|default:'খসড়া' }} #{{ d.pk }}</a></td><td>{{ d.customer.name }}</td><td>{{ d.get_kind_display }} · {{ d.date|date:'Y-m-d' }}</td><td>৳ {{ d.amount|taka }}</td><td><span class="badge">{{ d.status }}</span></td></tr>{% empty %}<tr><td colspan="5">এখনো কোনো এন্ট্রি নেই। নতুন চালান বা আদায় যোগ করুন।</td></tr>{% endfor %}</tbody></table></div>
